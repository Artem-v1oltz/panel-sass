<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/main.min.css">
</head>
<body>
    <div class="dashboard dashboard--normal">
        <header class="dashboard__header">
            <h1 class="dashboard__title">ORION-X</h1>
            <span class="dashboard__status">ONLINE</span>
        </header>
    
        <main class="dashboard__content">
    
            <section class="panel engine">
                <h2 class="panel__title">Двигун</h2>
    
                <div class="engine__value">87%</div>
    
                <div class="engine__bar">
                    <span class="engine__progress"></span>
                </div>
    
                <p class="panel__text">Система працює нормально</p>
            </section>
    
            <section class="panel energy">
                <h2 class="panel__title">Запас енергії</h2>
    
                <div class="energy__value">64%</div>
    
                <div class="energy__bar">
                    <span class="energy__progress"></span>
                </div>
    
                <p class="panel__text">Стабільний рівень</p>
            </section>
    
            <section class="panel mission">
                <h2 class="panel__title">Поточна місія</h2>
    
                <h3 class="mission__name">Дослідження сектора X-17</h3>
    
                <p class="mission__description">
                    Дослідити невідомий сектор галактики та знайти джерело сигналу.
                </p>
    
                <span class="mission__progress">Завершено: 72%</span>
            </section>
    
            <section class="controls">
                <h2 class="controls__title">Керування</h2>
    
                <div class="controls__buttons">
                    <button class="controls__button">Старт</button>
                    <button class="controls__button">Пауза</button>
                    <button class="controls__button">Автопілот</button>
                </div>
            </section>
    
            <section class="warning">
                <h2 class="warning__title">⚠ Попередження</h2>
    
                <p class="warning__text">
                    Виявлено невідомий об'єкт поблизу корабля.
                </p>
            </section>
    
        </main>
    </div>
</body>
</html>
